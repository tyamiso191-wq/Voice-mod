name: Build SimpleVoiceChatAEC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını kontrol et ve çıkar
  run: |
    echo "ZIP kontrol ediliyor..."
    file SimpleVoiceChatAEC-1.0.0-source.zip
    unzip -t SimpleVoiceChatAEC-1.0.0-source.zip

    echo "ZIP çıkarılıyor..."
    rm -rf extracted
    mkdir extracted
    unzip -q SimpleVoiceChatAEC-1.0.0-source.zip -d extracted

    echo "Çıkarılan dosyalar:"
    find extracted -maxdepth 3 -type f | sort

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle Wrapper'ı güncelle
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          chmod +x gradlew
          sed -i 's#gradle-8.12-bin.zip#gradle-9.0.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS="-Xmx64m -Xms64m"/' gradlew

      - name: Java sürümünü kontrol et
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Gradle sürümünü kontrol et
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          ./gradlew --version

      - name: Modu derle
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          ./gradlew build --no-daemon --stacktrace

      - name: JAR dosyasını yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVoiceChatAEC
          path: extracted/SimpleVoiceChatAEC/build/libs/*.jar
          if-no-files-found: error
