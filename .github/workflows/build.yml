name: Build SimpleVoiceChatAEC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q SimpleVoiceChatAEC-1.0.0-source.zip -d extracted
          echo "Extracted:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVoiceChatAEC
          path: extracted/SimpleVoiceChatAEC/build/libs/*.jar
