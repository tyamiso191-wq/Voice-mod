name: Build SimpleVoiceChatAEC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q SimpleVoiceChatAEC-1.0.0-source.zip -d extracted
          echo "Extracted project:"
          find extracted/SimpleVoiceChatAEC -maxdepth 2 -type f

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Gradle Wrapper
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          chmod +x gradlew
          sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS="-Xmx64m -Xms64m"/' gradlew
          grep DEFAULT_JVM_OPTS gradlew

      - name: Build
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVoiceChatAEC
          path: extracted/SimpleVoiceChatAEC/build/libs/*.jar
          if-no-files-found: error
