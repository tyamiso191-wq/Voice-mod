name: Build SimpleVoiceChatAEC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: ZIP dosyasını kontrol et ve çıkar
        run: |
          echo "ZIP kontrol ediliyor..."
          file SimpleVoiceChatAEC-1.0.0-source.zip
          unzip -t SimpleVoiceChatAEC-1.0.0-source.zip

          echo "ZIP çıkarılıyor..."
          rm -rf extracted
          mkdir extracted
          unzip -q SimpleVoiceChatAEC-1.0.0-source.zip -d extracted

          echo "Çıkarılan dosyalar:"
          find extracted -maxdepth 3 -type f | sort

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle Wrapper'ı hazırla
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          chmod +x gradlew
          sed -i 's#gradle-8.12-bin.zip#gradle-8.14-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS="-Xmx64m -Xms64m"/' gradlew

          echo "Gradle Wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Java sürümünü kontrol et
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Gradle sürümünü kontrol et
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          ./gradlew --version

      - name: Fabric API sürümünü kontrol et
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          echo "Fabric API sürümü:"
          grep fabric_version gradle.properties

      - name: Modu derle
        working-directory: extracted/SimpleVoiceChatAEC
        run: |
          ./gradlew build --no-daemon --stacktrace

      - name: JAR dosyasını yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVoiceChatAEC
          path: extracted/SimpleVoiceChatAEC/build/libs/*.jar
          if-no-files-found: error
